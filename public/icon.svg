<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="200" fill="url(#glowGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#sparkleGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Center AI Star / 4-Point Prism -->
  <path d="M 256 90 Q 256 256 422 256 Q 256 256 256 422 Q 256 256 90 256 Q 256 256 256 90 Z" fill="url(#sparkleGrad)" />

  <!-- Center Core Glow -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" />
  <circle cx="256" cy="256" r="18" fill="#38bdf8" />

  <!-- Diagonal Sparks -->
  <circle cx="160" cy="160" r="10" fill="#38bdf8" />
  <circle cx="352" cy="160" r="14" fill="#c084fc" />
  <circle cx="160" cy="352" r="12" fill="#818cf8" />
  <circle cx="352" cy="352" r="10" fill="#38bdf8" />
</svg>
